services:
  db:
    image: postgres:16-alpine
    container_name: elite-tickets-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: elite
      POSTGRES_PASSWORD: elite
      POSTGRES_DB: elite_tickets
    ports:
      - "5433:5432"
    volumes:
      - elite_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elite -d elite_tickets"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  elite_pgdata:
